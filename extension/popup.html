<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; padding: 14px 16px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #222; }
  h3 { margin: 0 0 6px; font-size: 16px; }
  .hint { color: #666; font-size: 12px; margin: 0 0 12px; line-height: 1.6; }
  label { display: block; margin-bottom: 10px; font-size: 13px; color: #444; }
  input[type="datetime-local"] { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  button { width: 100%; padding: 9px 0; font-size: 15px; color: #fff; background: #2a9df4; border: none; border-radius: 8px; cursor: pointer; margin-top: 4px; }
  button:hover { background: #1f8ae0; }
  #status { font-size: 12px; color: #666; margin: 10px 0 0; line-height: 1.6; min-height: 18px; }
</style>
</head>
<body>
  <h3>Telegram 按时间段导出</h3>
  <p class="hint">先在 Telegram 网页版打开要导出的聊天 / 群 / 频道，再设置起止时间，导出这段时间内的消息为 JSON。</p>
  <label>开始时间<input type="datetime-local" id="from"></label>
  <label>结束时间<input type="datetime-local" id="to"></label>
  <button id="go">开始导出 JSON</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
